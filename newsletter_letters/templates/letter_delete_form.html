{% extends 'letter_base.html' %}

{% block content %}
<div class="container mt-1">
    <h2>Удалить запись</h2>
    <p>Вы уверены, что хотите удалить "{{ letter.fio }}"?</p>

    <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a href="{% url 'newsletter_letters:letter' pk=letter.pk %}" class="btn btn-secondary">Отмена</a>
    </form>

</div>

{% endblock %}
