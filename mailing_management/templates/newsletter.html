{% extends 'newsletter_base.html' %}

{% block content %}
<div class="pricing-header px-3 py-3 pt-md-1 pb-md-1 mx-auto text-center">
    <h3>Рассылка</h3>
</div>
<div class="container mt-1">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5 text-center">
            <p class="text-justify">Начало-{{newsletter.start_time}}</p>
            <p class="text-justify">Конец-{{newsletter.end_time}}</p>
            <p class="text-justify">Статус-{{newsletter.status}}</p>
            <a class="p-2 btn btn-outline-warning btn-sm" href="{% url 'mailing_management:newsletter_edit' pk=newsletter.pk %}"> Изменить </a>
            <a class="p-2 btn btn-outline-danger btn-sm" href="{% url 'mailing_management:newsletter_delete' pk=newsletter.pk %}"> Удалить </a>
        </div>
    </div>
</div>

{% endblock %}
