<!doctype html>
{% load users_tags %}
{% load static %}
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>mine</title>
    <link rel="icon" href="{% static 'icons/skypro.ico' %}" type="image/x-icon">
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/mine.css' %}">

</head>
<body>
<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
    <nav class="ms-5 d-flex justify-content-between align-items-center w-100">
        {% if not request.path|path_in:"/login/,/login_/,/users/" %}
            <a class="btn btn-primary" href="#">Запуск рассылок</a>
        {% else %}
        <div></div>
        {% endif %}

        {% include 'includes/logout.html' %}
    </nav>

</div>

{% block content %}{% endblock %}
<div class="container">
    {% include 'includes/footer.html' %}
</div>
</body>
</html>
