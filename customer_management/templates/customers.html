{% extends 'customer_base.html' %}

{% block content %}
<div class="container">
    <h3 class="text-info mb-3 text-center">Клиенты рассылки</h3>
    <div class="row g-4">
        {% for customer in customers %}
        <div class="col-md-6 col-lg-4 text-center">
            <h6 class="text-dark mb-1">{{customer.fio}}</h6>
            <h6 class="text-dark mb-1">{{customer.email}}</h6>
            <p class="text-justify" style="max-width: 350px; margin: 0 auto;"> {{customer.description}}</p>
            <a href="{% url 'customer_management:customer' pk=customer.pk %}" class="btn btn-outline-primary w-50 rounded-sm"
               style="margin-top: 20px;">Подробности</a>
        </div>
        {% endfor %}

    </div>
</div>
{% endblock %}
