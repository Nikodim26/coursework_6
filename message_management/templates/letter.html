{% extends 'letter_base.html' %}

{% block content %}
<div class="pricing-header px-3 py-3 pt-md-1 pb-md-1 mx-auto text-center">
    <h3 class="mb-2">Письмо</h3>
    <div class="lh-sm mb-0">
        <p class="lead mb-1">
            <span class="fw-bold text-primary fs-5">
                Тема — "{{ letter.email_subject }}"
            </span>
        </p>
    </div>
</div>

<div class="container mt-3">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-light shadow-sm">
                <div class="card-body p-4">
                    <!-- Блок с телом письма -->
                    <div class="mb-4">
                        {% if letter.letter_body %}
                            <p class="text-start">{{ letter.letter_body }}</p>
                        {% else %}
                            <p class="text-muted fst-italic">
                                Тело письма не заполнено.
                            </p>
                        {% endif %}
                    </div>

                    <!-- Кнопки действий -->
                    <div class="d-flex justify-content-center gap-2 flex-wrap">
                        <a class="btn btn-outline-warning btn-sm px-3"
                           href="{% url 'message_management:letter_edit' pk=letter.pk %}">
                            <i class="bi bi-pencil me-1"></i> Изменить
                        </a>
                        <a class="btn btn-outline-danger btn-sm px-3"
                           href="{% url 'message_management:letter_delete' pk=letter.pk %}">
                            <i class="bi bi-trash me-1"></i> Удалить
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>


{% endblock %}
