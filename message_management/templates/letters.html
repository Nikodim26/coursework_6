{% extends 'letter_base.html' %}

{% block content %}
<div class="container mt-4">
    <h3 class="text-info mb-4 text-center">Письма</h3>

    <div class="row g-4">
        {% for letter in letters %}
        <div class="col-md-6 col-lg-4">
            <div class="card h-100 border-light shadow-sm">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title text-dark fw-bold mb-3">
                        {{ letter.email_subject }}
                    </h5>

                    <p class="card-text text-secondary mb-4 flex-grow-1">
                        {{ letter.letter_body|truncatechars:80 }}
                    </p>

                    <a href="{% url 'message_management:letter' pk=letter.pk %}"
                       class="btn btn-outline-primary btn-sm px-2 py-1 rounded-sm">
                        Подробности
                    </a>
                </div>
            </div>
        </div>
        {% empty %}
        <div class="col-12 text-center py-5">
            <p class="text-muted">Пока нет писем для отображения.</p>
        </div>
        {% endfor %}
    </div>
</div>

{% endblock %}
